[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "garage-sdk"
version = "0.1.0"
description = "Privacy-conscious local telemetry and Garage schemas"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garage_sdk = ["py.typed"]
