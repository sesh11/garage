<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>garage</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 1100px; padding: 24px; }
    header { align-items: center; display: flex; gap: 18px; justify-content: space-between; }
    h1 { font-size: 1.4rem; margin: 0; }
    #health, .meta { color: #888; font-size: .9rem; }
    select { border: 1px solid #8888; border-radius: 6px; padding: 6px; }
    table { border-collapse: collapse; margin-top: 18px; width: 100%; }
    th, td { border-bottom: 1px solid #8884; padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: #888; font-size: .8rem; font-weight: 600; }
    th:nth-child(1) { width: 12%; } th:nth-child(2) { width: 48%; }
    th:nth-child(3) { width: 10%; } th:nth-child(4) { width: 15%; } th:nth-child(5) { width: 15%; }
    .sev { border-radius: 10px; display: inline-block; font-size: .75rem; padding: 3px 7px; }
    .sev.low { background: #8883; } .sev.medium { background: #d9a20055; }
    .sev.high, .sev.critical { background: #d44a4a66; }
    .pill { border: 1px solid #8888; border-radius: 10px; display: inline-block; font-size: .75rem; padding: 3px 7px; }
    .pill.ready { border-color: #2a984d; color: #2a984d; }
    details { margin-top: 6px; }
    summary { color: #888; cursor: pointer; font-size: .85rem; }
    pre { font: 12px ui-monospace, monospace; overflow-x: auto; white-space: pre-wrap; }
    a { color: #4796e8; }
    .empty { color: #888; padding: 24px; text-align: center; }
    h2 { font-size: .9rem; font-weight: 600; margin: 28px 0 0; }
    label { margin-left: 10px; }
    #waiting-section { border: 1px solid #d9a20088; border-radius: 8px; margin-top: 18px; padding: 4px 12px 10px; }
    #waiting-section h2 { margin-top: 10px; }
    #waiting td:last-child { white-space: nowrap; }
    button { border: 1px solid #8888; border-radius: 6px; cursor: pointer; font: inherit; margin: 0 4px 4px 0; padding: 5px 10px; }
    button.approve { background: #2a984d; border-color: #2a984d; color: #fff; }
    button:disabled { cursor: default; opacity: .5; }
    .error { color: #d44a4a; font-size: .85rem; }
    @media (max-width: 700px) {
      body { padding: 14px; }
      th:nth-child(1) { width: 20%; } th:nth-child(2) { width: auto; }
      th:nth-child(3), td:nth-child(3) { display: none; }
      th:nth-child(4) { width: 24%; } th:nth-child(5) { width: 26%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>garage</h1>
      <div id="health" class="meta">Connecting…</div>
    </div>
    <div>
    <label id="project-picker" hidden>Project
      <select id="project">
        <option value="">All projects</option>
      </select>
    </label>
    <label>Window
      <select id="incident-window">
        <option value="1h">Last hour</option>
        <option value="24h" selected>Last 24 hours</option>
        <option value="7d">Last 7 days</option>
      </select>
    </label>
    </div>
  </header>
  <section id="waiting-section" hidden>
    <h2>Waiting for you</h2>
    <div class="meta">No coding agent starts until you approve. On GitHub: add <code>garage:ready-for-fix</code> to
      approve, close the issue to decline.</div>
    <table>
      <thead><tr><th>Project</th><th>Item</th><th>From</th><th>Issue</th><th>Decide</th></tr></thead>
      <tbody id="waiting"></tbody>
    </table>
  </section>
  <div id="incident-meta" class="meta"></div>
  <table>
    <thead><tr><th>Severity</th><th>Incident</th><th>Count</th><th>Last seen</th><th>Status</th></tr></thead>
    <tbody id="incidents"></tbody>
  </table>
  <h2 class="meta">Inbox</h2>
  <table>
    <thead><tr><th>State</th><th>Item</th><th>Project</th><th>From</th><th>Issue</th></tr></thead>
    <tbody id="items"></tbody>
  </table>
  <script>
    const openIncidents = new Set();
    function formatWindow(seconds) {
      return seconds % 86400 === 0 ? seconds / 86400 + "d" :
        seconds % 3600 === 0 ? seconds / 3600 + "h" : Math.round(seconds / 60) + "m";
    }
    function sampleText(event) {
      const details = Object.entries(event.data).map(([key, value]) => key + "=" + value).join(" ");
      return new Date(event.ts).toLocaleTimeString() + "  " + event.type + (details ? "  " + details : "");
    }
    function createIncidentRow(incident) {
      const row = document.createElement("tr");
      row.dataset.fingerprint = incident.fingerprint;
      row.innerHTML =
        '<td><span class="sev"></span></td>' +
        '<td><div class="title"></div><div class="meta rule"></div>' +
        '<details><summary></summary><pre class="samples"></pre></details></td>' +
        '<td class="count"></td><td class="last-seen"></td><td><span class="pill"></span></td>';
      row.querySelector("details").addEventListener("toggle", event => {
        if (event.target.open) openIncidents.add(incident.fingerprint);
        else openIncidents.delete(incident.fingerprint);
      });
      return row;
    }
    function updateIncidentRow(row, incident) {
      const severity = row.querySelector(".sev");
      severity.className = "sev " + incident.severity;
      severity.textContent = incident.severity;
      row.querySelector(".title").textContent = incident.title;
      row.querySelector(".rule").textContent =
        (incident.project ? incident.project + " · " : "") + incident.fingerprint;
      row.querySelector("summary").textContent = "Evidence (" + incident.samples.length + " latest events)";
      row.querySelector(".samples").textContent =
        incident.samples.slice().reverse().map(sampleText).join("\n");
      row.querySelector("details").open = openIncidents.has(incident.fingerprint);
      row.querySelector(".count").textContent =
        incident.count + " / " + incident.threshold + " in " + formatWindow(incident.window_s);
      row.querySelector(".last-seen").textContent = new Date(incident.last_seen).toLocaleString();
      const pill = row.querySelector(".pill");
      pill.className = "pill " + (incident.ready ? "ready" : "observed");
      pill.textContent = incident.ready ? "Ready for fix" : "Observed";
      let link = row.querySelector(".issue-link");
      if (incident.issue_url) {
        if (!link) {
          link = document.createElement("a");
          link.className = "issue-link meta";
          link.target = "_blank";
          link.rel = "noopener";
          pill.parentElement.appendChild(link);
        }
        link.href = incident.issue_url;
        link.textContent = "#" + incident.issue_url.split("/").pop();
      } else if (link) link.remove();
    }
    function renderIncidents(report) {
      const body = document.getElementById("incidents");
      const windowLabel = document.getElementById("incident-window").selectedOptions[0].textContent;
      const ready = report.incidents.filter(incident => incident.ready).length;
      document.getElementById("incident-meta").textContent =
        report.incidents.length + " incidents, " + ready + " ready for fix · detector: " +
        (report.detector || "none");
      const existing = Array.from(body.querySelectorAll("tr[data-fingerprint]"));
      body.querySelectorAll("tr.empty-row").forEach(row => row.remove());
      const seen = new Set();
      report.incidents.forEach(incident => {
        let row = existing.find(candidate => candidate.dataset.fingerprint === incident.fingerprint);
        if (!row) row = createIncidentRow(incident);
        updateIncidentRow(row, incident);
        body.appendChild(row);
        seen.add(incident.fingerprint);
      });
      existing.forEach(row => { if (!seen.has(row.dataset.fingerprint)) row.remove(); });
      if (!report.incidents.length) {
        const row = document.createElement("tr");
        row.className = "empty-row";
        row.innerHTML = '<td colspan="5" class="empty"></td>';
        row.querySelector("td").textContent = "No incidents in the " + windowLabel + ".";
        body.appendChild(row);
      }
    }
    function renderItems(items) {
      const body = document.getElementById("items");
      body.replaceChildren();
      items.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = '<td><span class="pill"></span></td><td></td><td></td><td></td><td></td>';
        const cells = row.querySelectorAll("td");
        cells[0].firstChild.textContent = item.state;
        cells[1].textContent = item.text;
        cells[2].textContent = item.project || "(no project)";
        cells[3].textContent = item.submitted_by;
        cells[4].appendChild(issueLink(item));
        body.appendChild(row);
      });
      if (!items.length) {
        const row = document.createElement("tr");
        row.innerHTML = '<td colspan="5" class="empty">No inbox items.</td>';
        body.appendChild(row);
      }
    }
    const pending = new Set();
    const failures = new Map();
    function issueLink(item) {
      if (!item.issue) return document.createTextNode("");
      const link = document.createElement("a");
      link.href = item.issue.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "#" + item.issue.number;
      return link;
    }
    async function decide(item, decision) {
      pending.add(item.id);
      failures.delete(item.id);
      try {
        const response = await fetch("/api/items/" + encodeURIComponent(item.id) + "/" + decision, {
          method: "POST", headers: {"Content-Type": "application/json"}, body: "{}",
        });
        if (!response.ok) failures.set(item.id, (await response.json()).error || response.statusText);
      } catch (error) {
        failures.set(item.id, String(error));
      }
      pending.delete(item.id);
      refresh();
    }
    function renderWaiting(items) {
      const waiting = items.filter(item => item.state === "awaiting_approval").reverse();
      document.getElementById("waiting-section").hidden = !waiting.length;
      const body = document.getElementById("waiting");
      body.replaceChildren();
      waiting.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = '<td></td><td></td><td></td><td></td><td></td>';
        const cells = row.querySelectorAll("td");
        cells[0].textContent = item.project || "(no project)";
        cells[1].textContent = item.text.length > 280 ? item.text.slice(0, 280) + "…" : item.text;
        cells[2].textContent = item.submitted_by;
        cells[3].appendChild(issueLink(item));
        [["approve", "Approve"], ["decline", "Decline"]].forEach(([decision, label]) => {
          const button = document.createElement("button");
          button.className = decision;
          button.textContent = label;
          button.disabled = pending.has(item.id);
          button.addEventListener("click", () => decide(item, decision));
          cells[4].appendChild(button);
        });
        if (failures.has(item.id)) {
          const error = document.createElement("div");
          error.className = "error";
          error.textContent = failures.get(item.id);
          cells[4].appendChild(error);
        }
        body.appendChild(row);
      });
    }
    const projectSelect = document.getElementById("project");
    async function loadProjects() {
      const projects = (await (await fetch("/api/projects")).json()).projects;
      const wanted = new URLSearchParams(location.search).get("project") || "";
      projects.forEach(project => {
        const option = document.createElement("option");
        option.value = project.name;
        option.textContent = project.name + " (" + project.repos.map(repo => repo.full_name).join(", ") + ")";
        projectSelect.appendChild(option);
      });
      const unassigned = document.createElement("option");
      unassigned.value = "_unassigned";
      unassigned.textContent = "No project";
      projectSelect.appendChild(unassigned);
      if (Array.from(projectSelect.options).some(option => option.value === wanted)) projectSelect.value = wanted;
      document.getElementById("project-picker").hidden = projects.length < 2;
    }
    async function refresh() {
      const health = await (await fetch("/api/health")).json();
      const project = projectSelect.value;
      document.getElementById("health").textContent =
        (health.projects.length ? health.projects.join(", ") + " · " : "") +
        (health.detector || "No detector") + (health.reporting ? " · reporting enabled" : " · reporting disabled");
      const since = document.getElementById("incident-window").value;
      const incidentQuery = "?since=" + encodeURIComponent(since) +
        (project && project !== "_unassigned" ? "&project=" + encodeURIComponent(project) : "");
      renderIncidents(project === "_unassigned" ? {incidents: [], detector: null} :
        await (await fetch("/api/incidents" + incidentQuery)).json());
      const items = await fetch("/api/items" + (project ? "?project=" + encodeURIComponent(project) : ""));
      const listed = items.ok ? (await items.json()).items : [];
      renderWaiting(listed);
      renderItems(listed);
    }
    projectSelect.addEventListener("change", () => {
      const url = new URL(location.href);
      if (projectSelect.value) url.searchParams.set("project", projectSelect.value);
      else url.searchParams.delete("project");
      history.replaceState(null, "", url);
      refresh();
    });
    document.getElementById("incident-window").addEventListener("change", refresh);
    loadProjects().then(refresh);
    setInterval(refresh, 2000);
  </script>
</body>
</html>
